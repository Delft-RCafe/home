- title: 'Presentation and code along: Reproducible Research with code notebooks'
  subtitle: 'Reproducibility is essential to credible and transparent research, but it is hard to achieve in practice. This session introduces practical steps to make your work more reproducible, focusing on tools that help you integrate your code, text, and results into a single, coherent workflow. Whether you use R or Python, Quarto provides a powerful framework to weave narrative and analysis together—making it easier to share, revise, and rerun your research. The session also highlights programming Cafés: a low-threshold platform where researchers meet to troubleshoot, learn, and support each other in building reproducible practices. Join us to see how the right tools and community support can make reproducibility not only achievable, but sustainable.'
  description: TUD Library, Albert Einstein
  author: Bjørn Bartholdy & Aleksandra Wilczynska
